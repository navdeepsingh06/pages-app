<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMS Document Upload</title>
    <!-- Fluent UI Core Styles for native Outlook styling -->
    <link rel="stylesheet" href="https://sharepointonline.com" />
    <link rel="stylesheet" href="taskpane.css" />
    <!-- Office.js library -->
    <script type="text/javascript" src="https://microsoft.com"></script>
</head>
<body class="ms-font-m ms-welcome">
    <header class="dms-header">
        <h1 class="ms-font-xl">DMS Connect</h1>
    </header>

    <main class="dms-container">
        <div id="emailInfo" class="email-card">
            <p class="section-title">Selected Email</p>
            <h2 id="emailSubject" class="ms-font-m font-bold">Loading email subject...</h2>
        </div>

        <div class="form-group">
            <label for="folderSelect" class="ms-font-s">Target Folder</label>
            <select id="folderSelect" class="dms-select">
                <option value="invoices">Invoices & Finance</option>
                <option value="legal">Legal Contracts</option>
                <option value="general">General Archive</option>
            </select>
        </div>

        <button id="uploadButton" class="dms-btn dms-btn-primary">
            <span class="ms-font-m">Upload Email to DMS</span>
        </button>

        <div id="statusMessage" class="status-msg ms-font-s hidden"></div>
    </main>

    <script src="taskpane.js"></script>
</body>
</html>
