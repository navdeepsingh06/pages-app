<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Send to ClaimCenter</title>
    <link rel="stylesheet" href="/taskpane.css" />
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <script src="/taskpane.js"></script>
  </head>
  <body>
    <main class="task-pane">
      <header class="page-header">
        <p class="eyebrow">ClaimCenter</p>
        <h1>Send to ClaimCenter</h1>
        <p class="intro">Attach the selected message to an existing claim.</p>
      </header>

      <p id="load-status" class="status" role="status">Loading selected email...</p>

      <section class="email-summary" aria-labelledby="email-summary-heading">
        <h2 id="email-summary-heading">Email summary</h2>
        <dl>
          <div>
            <dt>Subject</dt>
            <dd id="email-subject">Not available</dd>
          </div>
          <div>
            <dt>Sender</dt>
            <dd id="email-sender">Not available</dd>
          </div>
          <div>
            <dt>Received</dt>
            <dd id="email-received-date">Not available</dd>
          </div>
        </dl>
      </section>

      <form id="claim-form" novalidate>
        <label for="claim-number">Claim Number</label>
        <input id="claim-number" name="claimNumber" type="text" autocomplete="off" required aria-describedby="claim-number-error" />
        <p id="claim-number-error" class="field-error" role="alert"></p>
        <button id="submit-button" type="submit" disabled>Send to ClaimCenter</button>
      </form>

      <section id="result" class="result" hidden aria-live="polite">
        <h2>Ready to send</h2>
        <p id="result-message"></p>
        <pre id="payload-output"></pre>
      </section>
    </main>
  </body>
</html>
